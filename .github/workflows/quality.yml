name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VITE_DEMO_ONLY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          mkdir -p .runtime/quality-checkpoints
          npm ci 2>&1 | tee .runtime/quality-checkpoints/npm-ci.log

      - name: Check types, tests, knowledge, architecture and production build
        run: npm run quality:checkpoint

      - name: Upload quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/quality-checkpoints/*.log
            .runtime/quality-checkpoints/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
